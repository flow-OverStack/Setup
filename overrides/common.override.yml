# Layered onto repos/UserService/docker-compose.common.yml with `-f`.
# docker compose deep-merges: scalars are replaced, sequences are appended,
# mappings are merged key-by-key. Services not listed here pass through untouched.
services:
  keycloak:
    command: start --import-realm
    volumes:
      - ${SETUP_ROOT}/.keycloak-import:/opt/keycloak/data/import:ro

  # Heavy Kafka-ecosystem services, plus aspire-dashboard (a telemetry sink no
  # service's health check depends on any more) - nobody needs these for local
  # dev by default. `profiles: [extras]` means plain `up` skips them entirely
  # (not created, not started); `./extras.sh` creates/starts them on demand.
  control-center:
    profiles: [extras]
  connect:
    profiles: [extras]
  rest-proxy:
    profiles: [extras]
  schema-registry:
    profiles: [extras]
  flink-jobmanager:
    profiles: [extras]
  flink-taskmanager:
    profiles: [extras]
  flink-sql-client:
    profiles: [extras]
  aspire-dashboard:
    profiles: [extras]